name: Deploy Mexo Production

on:
  push:
    branches:
      - najlepsza-wersja
  workflow_dispatch:
    inputs:
      restore_release:
        description: Restore a previously verified release instead of deploying
        type: boolean
        required: false
        default: false
      restore_revision:
        description: Full 40-character source commit to restore
        type: string
        required: false
      restore_next_target:
        description: Managed .mexo-releases target to restore
        type: string
        required: false
      target_ip:
        description: Optional exact approved Oracle IPv4 address for a manual deploy
        type: string
        required: false
      preflight_only:
        description: Run read-only host and service checks without deploying
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: mexo-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ inputs.target_ip || '141.144.234.121' }}
          TARGET_IP_OVERRIDE: ${{ inputs.target_ip }}
          RESTORE_RELEASE: ${{ inputs.restore_release }}
        run: |
          set -euo pipefail
          if [ "$RESTORE_RELEASE" = "true" ]; then
            if [ -n "$TARGET_IP_OVERRIDE" ]; then
              echo "ERROR: rollback-only mode must use the existing recovery host, not a target override."
              exit 1
            fi
            echo "Rollback-only mode: using the approved Oracle host to restore the previous release."
          else
            resolved_oracle_ips="$(getent ahostsv4 "$ORACLE_HOST" | awk '{print $1}' | sort -u || true)"
            if ! printf '%s\n' "$resolved_oracle_ips" | grep -Fxq '141.144.234.121'; then
              echo "ERROR: selected SSH host does not resolve to the approved Oracle IP; no SSH connection or production change was attempted."
              exit 1
            fi
            echo "Verified selected SSH host resolves to the approved Oracle IP."
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/mexo-production
          chmod 600 ~/.ssh/mexo-production
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify current Oracle service and Nginx route (read-only)
        env:
          ORACLE_HOST: ${{ inputs.target_ip || '141.144.234.121' }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/mexo-production \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            "$ORACLE_USER@$ORACLE_HOST" \
            'bash -se' <<'PREFLIGHT'
          set -euo pipefail
          oracle_instance_state="$(curl -fsS --connect-timeout 2 --max-time 5 \
            -H 'Authorization: Bearer Oracle' \
            'http://169.254.169.254/opc/v2/instance/' | \
            python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("state", "")).lower())')"
          if [ "$oracle_instance_state" != "running" ]; then
            echo "ERROR: target does not report a running Oracle Cloud instance; deployment stopped before inspecting or changing application files."
            exit 1
          fi
          echo "Verified target is a running Oracle Cloud instance."
          REPO="/opt/mexo/repo"
          APP="/opt/mexo/repo/portfel-inwestora"
          EXPECTED_BRANCH="najlepsza-wersja"
          APPROVED_MIGRATION_BRANCH="migration/oracle-arm64-security"
          APPROVED_MIGRATION_REVISION="ee8eefd77c558f1620822438de8d100e24a41b74"
          CURRENT_BRANCH="$(git -C "$REPO" branch --show-current)"
          if [ "$CURRENT_BRANCH" != "$EXPECTED_BRANCH" ]; then
            CURRENT_REVISION="$(git -C "$REPO" rev-parse HEAD)"
            if [ "$CURRENT_BRANCH" != "$APPROVED_MIGRATION_BRANCH" ] || [ "$CURRENT_REVISION" != "$APPROVED_MIGRATION_REVISION" ]; then
              echo "ERROR: target repository is on ${CURRENT_BRANCH:-detached HEAD} at ${CURRENT_REVISION:0:12}; it is neither $EXPECTED_BRANCH nor the verified Oracle migration starting point. No production files were changed."
              exit 1
            fi
            echo "Verified clean, approved Oracle migration starting point; deployment will preserve its branch and rollback revision."
          fi
          SOURCE_REVISION="$(git -C "$REPO" ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk 'NR == 1 { print $1 }')"
          if ! [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Oracle cannot safely read the requested GitHub source branch; no production files were changed."
            exit 1
          fi
          echo "Verified read-only GitHub access to $EXPECTED_BRANCH at ${SOURCE_REVISION:0:12}."
          if [ -n "$(git -C "$REPO" status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: target repository contains tracked local changes; no production files were changed."
            exit 1
          fi
          SERVICE_WORKDIR="$(systemctl show -p WorkingDirectory --value mexo.service)"
          if [ "$SERVICE_WORKDIR" != "$APP" ]; then
            echo "ERROR: mexo.service WorkingDirectory does not match the approved application directory; deployment stopped before changing files."
            exit 1
          fi

          NODE_VERSION="$(node --version)"
          case "$NODE_VERSION" in
            v24.*) ;;
            *) echo "ERROR: target Node.js version $NODE_VERSION does not satisfy the repository's Node 24.x requirement; no production files were changed."; exit 1 ;;
          esac
          npm --version >/dev/null
          if [ -L "$APP/.next" ]; then
            CURRENT_NEXT_TARGET="$(readlink "$APP/.next")"
            case "$CURRENT_NEXT_TARGET" in
              .mexo-releases/*) test -f "$APP/$CURRENT_NEXT_TARGET/BUILD_ID" ;;
              *) echo "ERROR: current Next.js build points outside managed releases; no production files were changed."; exit 1 ;;
            esac
          elif [ -d "$APP/.next" ]; then
            test -f "$APP/.next/BUILD_ID"
          else
            echo "ERROR: no current Next.js build is available for rollback; no production files were changed."
            exit 1
          fi
          echo "Verified branch, Node $NODE_VERSION, application directory, and an existing Next.js build for rollback."

          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys
          import urllib.parse

          try:
              nginx = subprocess.run(
                  ["sudo", "-n", "nginx", "-T"],
                  check=True, capture_output=True, text=True
              ).stdout
              main_pid = int(subprocess.run(
                  ["systemctl", "show", "-p", "MainPID", "--value", "mexo.service"],
                  check=True, capture_output=True, text=True
              ).stdout.strip())
              control_group = subprocess.run(
                  ["systemctl", "show", "-p", "ControlGroup", "--value", "mexo.service"],
                  check=True, capture_output=True, text=True
              ).stdout.strip()
              cgroup_file = pathlib.Path("/sys/fs/cgroup") / control_group.lstrip("/") / "cgroup.procs"
              service_pids = {int(value) for value in cgroup_file.read_text().split() if value.isdigit()}
              if main_pid > 0:
                  service_pids.add(main_pid)
          except Exception:
              print("ERROR: unable to inspect the active service and Nginx configuration safely; deployment stopped before changing files.")
              sys.exit(1)

          upstream_ports = {}
          for match in re.finditer(r"\bupstream\s+([\w.-]+)\s*\{([^}]*)\}", nginx, re.S):
              ports = set()
              for target in re.findall(r"\bserver\s+([^;\s]+)", match.group(2)):
                  port = re.search(r":(\d+)$", target)
                  if port:
                      ports.add(int(port.group(1)))
              upstream_ports[match.group(1)] = ports

          def server_blocks(config):
              for match in re.finditer(r"\bserver\s*\{", config):
                  start = match.end() - 1
                  depth = 0
                  for index in range(start, len(config)):
                      if config[index] == "{":
                          depth += 1
                      elif config[index] == "}":
                          depth -= 1
                          if depth == 0:
                              yield config[start:index + 1]
                              break

          proxy_ports = set()
          domain_blocks = 0
          for block in server_blocks(nginx):
              names = " ".join(re.findall(r"(?m)^\s*server_name\s+([^;]+);", block))
              if not re.search(r"(?:^|\s)(?:www\.)?mexo\.com\.pl(?:\s|$)", names):
                  continue
              domain_blocks += 1
              for destination in re.findall(r"(?m)^\s*proxy_pass\s+([^;\s]+)", block):
                  parsed = urllib.parse.urlparse(destination)
                  if parsed.hostname in upstream_ports:
                      proxy_ports.update(upstream_ports[parsed.hostname])
                  elif parsed.port:
                      proxy_ports.add(parsed.port)
          if domain_blocks == 0 or not proxy_ports:
              print("ERROR: no explicit Nginx proxy route for mexo.com.pl was found; deployment stopped before changing files.")
              sys.exit(1)

          try:
              ss = subprocess.run(["sudo", "-n", "ss", "-ltnp"], check=True, capture_output=True, text=True).stdout
          except Exception:
              print("ERROR: unable to inspect listening service ports safely; deployment stopped before changing files.")
              sys.exit(1)
          service_ports = set()
          for line in ss.splitlines():
              pids = {int(value) for value in re.findall(r"pid=(\d+)", line)}
              if not pids.intersection(service_pids):
                  continue
              fields = line.split()
              if len(fields) > 3:
                  # `ss -ltnp` omits the Netid column; Local Address:Port is fields[3].
                  port = re.search(r":(\d+)$", fields[3])
                  if port:
                      service_ports.add(int(port.group(1)))

          matched = proxy_ports.intersection(service_ports)
          if not matched:
              print("ERROR: Nginx does not proxy mexo.com.pl to a listening port owned by mexo.service; deployment stopped before changing files.")
              print(f"Diagnostic ports only — Nginx: {sorted(proxy_ports)}; mexo.service: {sorted(service_ports)}")
              sys.exit(1)
          print(f"Read-only preflight passed: mexo.service working directory is correct and Nginx reaches its active listener on port(s) {sorted(matched)}.")
          PY
          PREFLIGHT

          root_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -H 'Cache-Control: no-cache, no-store' 'https://mexo.com.pl/?preflight=1' || true)"
          login_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -H 'Cache-Control: no-cache, no-store' 'https://mexo.com.pl/login?preflight=1' || true)"
          if [ "$root_code" != "200" ] || [ "$login_code" != "200" ]; then
            echo "ERROR: public landing/login routes are not healthy before deployment; no production files were changed."
            exit 1
          fi
          echo "Public pre-deploy routes are healthy."

      - name: Complete read-only preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_release != true && inputs.preflight_only == true }}
        run: echo "Read-only Oracle preflight passed. No production files were changed."

      - name: Stage and activate Mexo
        id: deploy
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.restore_release != true && inputs.preflight_only != true) }}
        env:
          ORACLE_HOST: ${{ inputs.target_ip || '141.144.234.121' }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          set +e
          REMOTE_OUTPUT="$(ssh \
            -i ~/.ssh/mexo-production \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=30 \
            -o TCPKeepAlive=yes \
            "$ORACLE_USER@$ORACLE_HOST" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          REPO="/opt/mexo/repo"
          APP="$REPO/portfel-inwestora"
          BRANCH="najlepsza-wersja"
          RELEASES="$APP/.mexo-releases"

          cd "$REPO"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: production repository contains tracked local changes; refusing to overwrite them."
            git status --short
            exit 1
          fi
          CURRENT_BRANCH="$(git branch --show-current)"
          PREVIOUS_REVISION="$(git rev-parse HEAD)"
          if [ "$CURRENT_BRANCH" != "$BRANCH" ]; then
            APPROVED_MIGRATION_BRANCH="migration/oracle-arm64-security"
            APPROVED_MIGRATION_REVISION="ee8eefd77c558f1620822438de8d100e24a41b74"
            if [ "$CURRENT_BRANCH" != "$APPROVED_MIGRATION_BRANCH" ] || [ "$PREVIOUS_REVISION" != "$APPROVED_MIGRATION_REVISION" ]; then
              echo "ERROR: expected production branch $BRANCH or the exact verified Oracle migration start, found ${CURRENT_BRANCH:-detached HEAD} at ${PREVIOUS_REVISION:0:12}; refusing to deploy."
              exit 1
            fi
            echo "Preserving verified migration branch $CURRENT_BRANCH at $PREVIOUS_REVISION while switching to $BRANCH."
          else
            echo "Preflight passed: production branch is $CURRENT_BRANCH."
          fi

          git fetch origin "$BRANCH"
          BUILD_REVISION="$(git rev-parse "origin/$BRANCH")"
          if ! git -C "$REPO" diff --quiet "$PREVIOUS_REVISION" "$BUILD_REVISION" -- package.json package-lock.json portfel-inwestora/package.json; then
            echo "ERROR: dependency manifests changed. Refusing an in-place npm install while the old release is live."
            echo "Use a dependency-staged release before deploying package changes."
            exit 1
          fi
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"
          RESET_REVISION="$(git rev-parse HEAD)"
          if [ "$RESET_REVISION" != "$BUILD_REVISION" ]; then
            echo "ERROR: repository reset did not reach requested revision (current ${RESET_REVISION:0:12}, expected ${BUILD_REVISION:0:12})."
            exit 1
          fi
          echo "Repository is staged at ${BUILD_REVISION:0:12}; previous revision was ${PREVIOUS_REVISION:0:12}."
          BUILD_SUFFIX="$(date -u +%Y%m%dT%H%M%SZ)-$$"
          STAGING_DIST=".next-mexo-staging-$BUILD_SUFFIX"
          RELEASE_TARGET=".mexo-releases/$BUILD_REVISION-$BUILD_SUFFIX"
          PREVIOUS_NEXT_TARGET=""
          SWITCHED=0

          rollback_on_error() {
            status=$?
            trap - ERR
            set +e
            if [ -n "$PREVIOUS_NEXT_TARGET" ] && [ -d "$APP/$PREVIOUS_NEXT_TARGET" ] && { [ "$SWITCHED" = "1" ] || [ ! -e "$APP/.next" ]; }; then
              ln -sfn "$PREVIOUS_NEXT_TARGET" "$APP/.next-rollback-$BUILD_SUFFIX"
              mv -Tf "$APP/.next-rollback-$BUILD_SUFFIX" "$APP/.next"
            fi
            git -C "$REPO" reset --hard "$PREVIOUS_REVISION"
            sudo -n systemctl restart mexo
            exit "$status"
          }
          trap rollback_on_error ERR

          mkdir -p "$RELEASES"
          case "$STAGING_DIST" in .next-mexo-staging-*) ;; *) echo "Invalid staging directory"; exit 1 ;; esac
          rm -rf "$APP/$STAGING_DIST"
          # The old workflow generated this file after restart, so Next never
          # reliably included it in the running artifact. Revision is now a
          # dynamic no-store API route instead.
          rm -f "$APP/public/mexo-build-revision.txt"

          cd "$REPO"
          if [ ! -x "$REPO/node_modules/.bin/next" ] && [ ! -x "$APP/node_modules/.bin/next" ]; then
            echo "ERROR: Next.js CLI is missing from both repository and application node_modules; no dependency install was attempted."
            exit 1
          fi
          echo "Next.js CLI is present; building into isolated staging directory $STAGING_DIST."
          CIRCLE_NODE_TOTAL=2 \
          NEXT_TELEMETRY_DISABLED=1 \
          MEXO_BUILD_REVISION="$BUILD_REVISION" \
          MEXO_BUILD_DIST_DIR="$STAGING_DIST" \
          NODE_OPTIONS="--max-old-space-size=768" \
            npm --workspace portfel-inwestora run build -- --webpack
          test -f "$APP/$STAGING_DIST/BUILD_ID"

          mv "$APP/$STAGING_DIST" "$APP/$RELEASE_TARGET"
          if [ -L "$APP/.next" ]; then
            PREVIOUS_NEXT_TARGET="$(readlink "$APP/.next")"
            case "$PREVIOUS_NEXT_TARGET" in
              .mexo-releases/*) test -d "$APP/$PREVIOUS_NEXT_TARGET" ;;
              *) echo "ERROR: current .next symlink points outside managed releases; refusing activation."; exit 1 ;;
            esac
          elif [ -d "$APP/.next" ]; then
            PREVIOUS_NEXT_TARGET=".mexo-releases/previous-$PREVIOUS_REVISION-$BUILD_SUFFIX"
            mv "$APP/.next" "$APP/$PREVIOUS_NEXT_TARGET"
          else
            echo "ERROR: no current Next.js build exists for safe rollback."
            exit 1
          fi

          ln -s "$RELEASE_TARGET" "$APP/.next-new-$BUILD_SUFFIX"
          SWITCHED=1
          mv -Tf "$APP/.next-new-$BUILD_SUFFIX" "$APP/.next"
          sudo -n systemctl restart mexo
          sudo -n systemctl is-active --quiet mexo

          LOCAL_SERVICE_PORTS="$(python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          try:
              control_group = subprocess.run(
                  ["systemctl", "show", "-p", "ControlGroup", "--value", "mexo.service"],
                  check=True, capture_output=True, text=True
              ).stdout.strip()
              main_pid = int(subprocess.run(
                  ["systemctl", "show", "-p", "MainPID", "--value", "mexo.service"],
                  check=True, capture_output=True, text=True
              ).stdout.strip())
              cgroup_file = pathlib.Path("/sys/fs/cgroup") / control_group.lstrip("/") / "cgroup.procs"
              service_pids = {int(value) for value in cgroup_file.read_text().split() if value.isdigit()}
              if main_pid > 0:
                  service_pids.add(main_pid)
              ss = subprocess.run(["sudo", "-n", "ss", "-ltnp"], check=True, capture_output=True, text=True).stdout
          except Exception:
              print("ERROR: unable to identify the active mexo.service listener for local revision verification.")
              sys.exit(1)

          ports = set()
          for line in ss.splitlines():
              pids = {int(value) for value in re.findall(r"pid=(\d+)", line)}
              fields = line.split()
              if pids.intersection(service_pids) and len(fields) > 3:
                  match = re.search(r":(\d+)$", fields[3])
                  if match:
                      ports.add(int(match.group(1)))
          if not ports:
              print("ERROR: mexo.service has no identifiable active TCP listener.")
              sys.exit(1)
          print(" ".join(str(port) for port in sorted(ports)))
          PY
          )"
          LOCAL_REVISION_VERIFIED=0
          for port in $LOCAL_SERVICE_PORTS; do
            response="$(curl -fsS --max-time 8 -H 'Host: mexo.com.pl' \
              "http://127.0.0.1:$port/api/system/revision?nonce=$BUILD_SUFFIX" 2>/dev/null || true)"
            local_revision="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("revision", ""))' 2>/dev/null || true)"
            if [ "$local_revision" = "$BUILD_REVISION" ]; then
              LOCAL_REVISION_VERIFIED=1
              break
            fi
          done
          if [ "$LOCAL_REVISION_VERIFIED" != "1" ]; then
            echo "ERROR: the active local mexo.service does not serve the staged revision; restoring the previous release before any public verification."
            false
          fi
          echo "Verified local mexo.service revision $BUILD_REVISION; now checking the public domain."

          trap - ERR
          echo "PREVIOUS_REVISION=$PREVIOUS_REVISION"
          echo "PREVIOUS_NEXT_TARGET=$PREVIOUS_NEXT_TARGET"
          echo "DEPLOYED_REVISION=$BUILD_REVISION"
          REMOTE
          )"
          SSH_STATUS=$?
          set -e

          printf '%s\n' "$REMOTE_OUTPUT"
          if [ "$SSH_STATUS" -ne 0 ]; then
            echo "ERROR: remote stage/activation command exited with status $SSH_STATUS; see the last safe checkpoint above."
            exit "$SSH_STATUS"
          fi
          previous_revision="$(printf '%s\n' "$REMOTE_OUTPUT" | sed -n 's/^PREVIOUS_REVISION=//p' | tail -n 1)"
          previous_target="$(printf '%s\n' "$REMOTE_OUTPUT" | sed -n 's/^PREVIOUS_NEXT_TARGET=//p' | tail -n 1)"
          if [[ ! "$previous_revision" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$previous_target" =~ ^\.mexo-releases/[A-Za-z0-9._-]+$ ]]; then
            echo "ERROR: deployment did not return a valid rollback target."
            exit 1
          fi
          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"
          echo "previous_next_target=$previous_target" >> "$GITHUB_OUTPUT"

      - name: Restore previous production release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_release == true }}
        env:
          ORACLE_HOST: ${{ inputs.target_ip || '141.144.234.121' }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          RESTORE_REVISION: ${{ inputs.restore_revision }}
          RESTORE_NEXT_TARGET: ${{ inputs.restore_next_target }}
        run: |
          set -euo pipefail
          [[ "$RESTORE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RESTORE_NEXT_TARGET" =~ ^\.mexo-releases/[A-Za-z0-9._-]+$ ]]
          ssh \
            -i ~/.ssh/mexo-production \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "bash -se" <<REMOTE
          set -euo pipefail
          REPO="/opt/mexo/repo"
          APP="\$REPO/portfel-inwestora"
          RESTORE_REVISION="$RESTORE_REVISION"
          RESTORE_NEXT_TARGET="$RESTORE_NEXT_TARGET"
          SERVICE_WORKDIR="\$(systemctl show -p WorkingDirectory --value mexo.service)"
          test "\$SERVICE_WORKDIR" = "\$APP"
          test -d "\$APP/\$RESTORE_NEXT_TARGET"
          cd "\$REPO"
          if [ -n "\$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: tracked production changes exist; refusing to restore over them."
            exit 1
          fi
          git cat-file -e "\$RESTORE_REVISION^{commit}"
          git reset --hard "\$RESTORE_REVISION"
          ln -sfn "\$RESTORE_NEXT_TARGET" "\$APP/.next-rollback-current"
          mv -Tf "\$APP/.next-rollback-current" "\$APP/.next"
          sudo -n systemctl restart mexo
          sudo -n systemctl is-active --quiet mexo
          echo "Previous source revision and managed build restored; mexo.service is active."
          REMOTE

      - name: Verify restored public routes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_release == true }}
        run: |
          set -euo pipefail
          nonce="restore-${GITHUB_RUN_ID}-${RANDOM}"
          root_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -H 'Cache-Control: no-cache, no-store' "https://mexo.com.pl/?health=$nonce" || true)"
          login_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -H 'Cache-Control: no-cache, no-store' "https://mexo.com.pl/login?health=$nonce" || true)"
          if [ "$root_code" != "200" ] || [ "$login_code" != "200" ]; then
            echo "ERROR: restored release is active, but public dashboard/login health checks failed."
            exit 1
          fi
          echo "Restored release is serving healthy public dashboard and login routes."

      - name: Verify public revision and routes
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.restore_release != true && inputs.preflight_only != true) }}
        id: verify
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERIFIED=0
          for attempt in $(seq 1 90); do
            nonce="${GITHUB_RUN_ID}-${attempt}-${RANDOM}"
            response="$(curl -fsS --max-time 12 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "https://mexo.com.pl/api/system/revision?nonce=$nonce" 2>/dev/null || true)"
            if printf '%s' "$response" | jq -e --arg expected "$EXPECTED_REVISION" '.revision == $expected' >/dev/null 2>&1; then
              root_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 "https://mexo.com.pl/?health=$nonce" || true)"
              login_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 "https://mexo.com.pl/login?health=$nonce" || true)"
              if [ "$root_code" = "200" ] && [ "$login_code" = "200" ]; then
                echo "Verified deployed revision $EXPECTED_REVISION; public dashboard and login routes are healthy."
                VERIFIED=1
                break
              fi
            fi
            sleep 2
          done
          test "$VERIFIED" = "1"

      - name: Roll back if public verification failed
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure' }}
        env:
          ORACLE_HOST: ${{ inputs.target_ip || '141.144.234.121' }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          PREVIOUS_REVISION: ${{ steps.deploy.outputs.previous_revision }}
          PREVIOUS_NEXT_TARGET: ${{ steps.deploy.outputs.previous_next_target }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIOUS_NEXT_TARGET" =~ ^\.mexo-releases/[A-Za-z0-9._-]+$ ]]
          ssh \
            -i ~/.ssh/mexo-production \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "bash -se" <<REMOTE
          set -euo pipefail
          REPO="/opt/mexo/repo"
          APP="\$REPO/portfel-inwestora"
          PREVIOUS_REVISION="$PREVIOUS_REVISION"
          PREVIOUS_NEXT_TARGET="$PREVIOUS_NEXT_TARGET"
          case "\$PREVIOUS_NEXT_TARGET" in .mexo-releases/*) ;; *) exit 1 ;; esac
          test -d "\$APP/\$PREVIOUS_NEXT_TARGET"
          cd "\$REPO"
          git reset --hard "\$PREVIOUS_REVISION"
          ln -sfn "\$PREVIOUS_NEXT_TARGET" "\$APP/.next-rollback-current"
          mv -Tf "\$APP/.next-rollback-current" "\$APP/.next"
          sudo -n systemctl restart mexo
          sudo -n systemctl is-active --quiet mexo
          echo "Previous code and build restored; mexo.service is active. Public landing/login routes will be checked by the runner."
          REMOTE
          root_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 -H 'Cache-Control: no-cache, no-store' "https://mexo.com.pl/?rollback=$GITHUB_RUN_ID" || true)"
          login_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 -H 'Cache-Control: no-cache, no-store' "https://mexo.com.pl/login?rollback=$GITHUB_RUN_ID" || true)"
          if [ "$root_code" != "200" ] || [ "$login_code" != "200" ]; then
            echo "ERROR: previous release is restored and systemd is active, but public landing/login routes are not healthy."
            exit 1
          fi
          echo "Previous release restored; public landing and login routes are healthy."
