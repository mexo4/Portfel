name: Deploy Mexo Production

on:
  push:
    branches:
      - najlepsza-wersja
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mexo-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/mexo-production
          chmod 600 ~/.ssh/mexo-production

          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Mexo
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/mexo-production \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=30 \
            -o TCPKeepAlive=yes \
            "$ORACLE_USER@$ORACLE_HOST" \
            'bash -se' <<'REMOTE'

          set -Eeuo pipefail

          REPO="/opt/mexo/repo"
          BRANCH="najlepsza-wersja"

          echo "== Mexo deploy =="

          cd "$REPO"

          echo "Checking production repository..."

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: Production repository contains local tracked changes."
            git status --short
            exit 1
          fi

          echo "Fetching GitHub..."
          git fetch origin "$BRANCH"

          echo "Updating production code..."
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          echo "Installing dependencies..."
          npm ci --no-audit --no-fund

          echo "Building Mexo..."
          # Oracle Free is deliberately small. A heap limit larger than the
          # machine can sustain lets the kernel kill Node (and sometimes the
          # SSH session) before Next can report a useful build error.
          CIRCLE_NODE_TOTAL=2 \
          NEXT_TELEMETRY_DISABLED=1 \
          MEXO_BUILD_REVISION="$(git rev-parse HEAD)" \
          NODE_OPTIONS="--max-old-space-size=768" \
            npm run build

          test -f "$REPO/portfel-inwestora/.next/BUILD_ID"

          echo "Restarting Mexo..."
          sudo -n systemctl restart mexo

          echo "Mexo restart requested."
          REMOTE

      - name: Verify public revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Verify the public route users actually receive. This avoids
          # coupling deploy success to private loopback/proxy topology on the
          # Oracle host while still requiring the exact newly built revision.
          for attempt in $(seq 1 180); do
            # A restart briefly yields a connection error or 5xx. That is an
            # expected transient state, not a reason to abort the retry loop.
            running_revision="$(curl -fsSI --max-time 15 https://mexo.com.pl/login 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1) == "x-mexo-revision" { print $2 }' || true)"

            if [ "$running_revision" = "$EXPECTED_REVISION" ]; then
              echo "Mexo public health check passed for revision $running_revision."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: public Mexo revision did not reach $EXPECTED_REVISION."
          exit 1
