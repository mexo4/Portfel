name: GPW quality audit

on:
  pull_request:
    paths:
      - "portfel-inwestora/src/lib/corporate-events.ts"
      - "portfel-inwestora/src/lib/server/corporate-events.ts"
      - "portfel-inwestora/src/lib/**/gpw*"
      - "portfel-inwestora/src/app/api/calendar/**"
      - "portfel-inwestora/tests/**gpw*.test.mjs"
      - "portfel-inwestora/tests/**corporate*.test.mjs"
      - "portfel-inwestora/tests/fixtures/gpw-*.mjs"
      - "portfel-inwestora/scripts/gpw-*.mjs"
      - "portfel-inwestora/scripts/run-gpw-*.mjs"
      - "portfel-inwestora/docs/gpw-*.json"
      - "package.json"
      - "package-lock.json"
      - "portfel-inwestora/package.json"
      - ".github/workflows/gpw-quality-audit.yml"
  push:
    branches:
      - "najlepsza-wersja"
      - "fix/gpw-quality-audit-20261024"
      - "fix/gpw-source-audit-20261025"
    paths:
      - "portfel-inwestora/src/lib/corporate-events.ts"
      - "portfel-inwestora/src/lib/server/corporate-events.ts"
      - "portfel-inwestora/src/lib/**/gpw*"
      - "portfel-inwestora/src/app/api/calendar/**"
      - "portfel-inwestora/tests/**gpw*.test.mjs"
      - "portfel-inwestora/tests/**corporate*.test.mjs"
      - "portfel-inwestora/tests/fixtures/gpw-*.mjs"
      - "portfel-inwestora/scripts/gpw-*.mjs"
      - "portfel-inwestora/scripts/run-gpw-*.mjs"
      - "portfel-inwestora/docs/gpw-*.json"
      - "package.json"
      - "package-lock.json"
      - "portfel-inwestora/package.json"
      - ".github/workflows/gpw-quality-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-quality-gate:
    name: Parser, corpus and API/ICS contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check parser, corpus and anti-ticker policy
        run: npm run gpw:audit

      - name: Detect fixture anomalies
        run: npm run gpw:anomalies

      - name: Benchmark deterministic parser corpus
        run: npm run gpw:benchmark

      - name: Execute real source-code mutation tests
        run: npm run gpw:mutation

      - name: Test parser to API/ICS contracts
        run: npm run gpw:e2e

      - name: Publish audit summary
        if: always()
        run: |
          if [ -f portfel-inwestora/artifacts/gpw-quality/audit.md ]; then
            cat portfel-inwestora/artifacts/gpw-quality/audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No GPW audit report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload GPW quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpw-quality-audit-${{ github.run_id }}
          path: portfel-inwestora/artifacts/gpw-quality/
          if-no-files-found: warn
          retention-days: 30

  isolated-postgres-contracts:
    name: Native isolated PostgreSQL contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Start native PostgreSQL and create isolated test database
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          cluster="$(pg_lsclusters --no-header | awk '$2 == "main" { print $1, $2, $4; exit }')"
          if [[ -z "$cluster" ]]; then
            echo "Native PostgreSQL package did not create a test cluster."
            exit 1
          fi
          read -r version name status <<< "$cluster"
          if [[ "$status" != "online" ]]; then
            sudo pg_ctlcluster "$version" "$name" start
          fi
          pg_isready -h 127.0.0.1
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE mexo_gpw_test LOGIN PASSWORD '$password'" > /dev/null
          sudo -u postgres createdb --owner=mexo_gpw_test --encoding=UTF8 --template=template0 mexo_gpw_test
          PGPASSWORD="$password" psql -h 127.0.0.1 -U mexo_gpw_test -d mexo_gpw_test -Atqc 'SELECT 1' | grep -qx 1
          echo "MEXO_GPW_TEST_DATABASE_URL=postgresql://mexo_gpw_test:${password}@127.0.0.1/mexo_gpw_test" >> "$GITHUB_ENV"

      - name: Run required PostgreSQL E2E contracts
        run: npm --workspace portfel-inwestora run gpw:e2e:postgres
        env:
          POSTGRES_CA_CERT_BASE64: ""
          POSTGRES_CA_CERT_PATH: ""

      - name: Build local production app for isolated HTTP E2E
        run: npm --workspace portfel-inwestora run build -- --webpack
        env:
          DATABASE_URL: ${{ env.MEXO_GPW_TEST_DATABASE_URL }}
          POSTGRES_CA_CERT_BASE64: ""
          POSTGRES_CA_CERT_PATH: ""

      - name: Exercise real local HTTP calendar, API and ICS reads
        run: npm --workspace portfel-inwestora run gpw:http:e2e
        env:
          POSTGRES_CA_CERT_BASE64: ""
          POSTGRES_CA_CERT_PATH: ""

      - name: Publish PostgreSQL E2E summary
        if: always()
        run: |
          if [ -f portfel-inwestora/artifacts/gpw-quality/e2e.md ]; then
            cat portfel-inwestora/artifacts/gpw-quality/e2e.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Required PostgreSQL E2E report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload PostgreSQL E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpw-postgres-e2e-${{ github.run_id }}
          path: |
            portfel-inwestora/artifacts/gpw-quality/e2e.*
            portfel-inwestora/artifacts/gpw-quality/http-e2e.json
          if-no-files-found: warn
          retention-days: 30
