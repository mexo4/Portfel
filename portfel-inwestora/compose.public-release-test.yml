services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mexo_hardening_test
      POSTGRES_USER: mexo_hardening_test
      POSTGRES_PASSWORD: mexo_hardening_local_only
    ports:
      - "127.0.0.1:55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mexo_hardening_test -d mexo_hardening_test"]
      interval: 2s
      timeout: 3s
      retries: 20
